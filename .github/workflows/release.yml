# v* etiketi itilince: testler + cihaz ikilisi (x86_64, Debian 13 uyumlu) + kurulum dosyaları → GitHub release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q wireguard-tools openssh-client
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sh scripts/sunucu/merkez/tests/hepsi.sh python
      - run: cargo build --release --locked
      - name: Paketle
        run: |
          s="${GITHUB_REF_NAME}"
          mkdir -p dist
          install -m 755 target/release/wificorrect dist/wificorrect
          tar -czf "dist/wificorrect-cihaz-${s}-x86_64.tar.gz" -C dist wificorrect -C .. deploy
          tar -czf "dist/wificorrect-sunucu-${s}.tar.gz" --exclude=__pycache__ -C scripts sunucu
          (cd dist && sha256sum wificorrect *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wificorrect dist/*.tar.gz dist/SHA256SUMS \
            --title "WifiCorrect ${GITHUB_REF_NAME}" --generate-notes
