# WifiCorrect müşteri ağı: DHCP + DNS yalnızca br-hotspot üzerinde (dükkân ağına DHCP verilmez)
interface=br-hotspot
bind-dynamic
no-dhcp-interface=enp3s0
dhcp-authoritative
dhcp-range=10.50.0.20,10.50.0.249,255.255.255.0,2h
dhcp-option=option:router,10.50.0.1
dhcp-option=option:dns-server,10.50.0.1
domain-needed
bogus-priv
cache-size=1000
# 5651 DNS kaydı için (kaydedici yazılınca okunacak)
log-queries=extra
