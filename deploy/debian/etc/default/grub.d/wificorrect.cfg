# WifiCorrect (2026-10-05, cihazda ölçüldü): monitörsüz açılışta grafik GRUB takılıyordu → metin konsolu.
# J1900 (Bay Trail) derin C-state donması → intel_idle.max_cstate=1. Seri konsol: QEMU duman testi ve servis;
# systemd.show_status=1: "quiet" durum satırlarını gizler, seri konsolda (son console=) görünsün (monitörde değişiklik yok).
GRUB_TERMINAL=console
GRUB_TIMEOUT=3
GRUB_CMDLINE_LINUX_DEFAULT="quiet systemd.show_status=1 intel_idle.max_cstate=1 console=tty0 console=ttyS0,115200n8"
